<h1>Salesforce Accounts</h1>

<h2>Create New Account</h2>

<form (ngSubmit)="createAccount()">

  <label>Account Name:</label>
  <input
    type="text"
    [(ngModel)]="newAccount.Name"
    name="Name"
    required
  />

  <br><br>

  <label>Industry:</label>
  <input
    type="text"
    [(ngModel)]="newAccount.Industry"
    name="Industry"
  />

  <br><br>

  <label>Phone:</label>
  <input
    type="text"
    [(ngModel)]="newAccount.Phone"
    name="Phone"
  />

  <br><br>

  <button type="submit">Create Account</button>

</form>

<hr>
<div *ngIf="editingAccount">

  <h2>Edit Account</h2>

  <form (ngSubmit)="updateAccount()">

    <label>Account Name:</label>
    <input
      type="text"
      [(ngModel)]="editingAccount.Name"
      name="editName"
      required
    />

    <br><br>

    <label>Industry:</label>
    <input
      type="text"
      [(ngModel)]="editingAccount.Industry"
      name="editIndustry"
    />

    <br><br>

    <label>Phone:</label>
    <input
      type="text"
      [(ngModel)]="editingAccount.Phone"
      name="editPhone"
    />

    <br><br>

    <button type="submit">Update Account</button>

    <button type="button" (click)="cancelEdit()">
      Cancel
    </button>

  </form>

  <hr>

</div>
<h2>Account List</h2>

<table border="1" cellpadding="10">
  <thead>
    <tr>
      <th>Name</th>
      <th>Industry</th>
      <th>Phone</th>
      <th>Actions</th>
    </tr>
  </thead>

  <tbody>
    <tr *ngFor="let account of accounts">
      <td>{{ account.Name }}</td>
      <td>{{ account.Industry }}</td>
      <td>{{ account.Phone }}</td>
      <td>
        <button (click)="editAccount(account)">
  Edit
</button>
        <button (click)="deleteAccount(account.Id)">
          Delete
        </button>
      </td>
    </tr>
  </tbody>
</table>
